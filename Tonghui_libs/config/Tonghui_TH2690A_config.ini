[DEFAULT]
# Здесь не нужно ничего добавлять

[SAMPLE]
# Режим прибора
# RES|VOLT|CURR
Func = CURR

# Диапазон измерения
# CURR: 1 - Auto; 2 - 20mA; 3 - 2mA; 4 - 200uA; 5 - 20uA; 6 - 2uA; 7 - 200nA; 8 - 20nA; 9 - 2nA; 10 - 200pA; 11 - 20pA
# RES:  1 - Auto; 2 - 100TΩ; 3 - 10TΩ; 4 - 1TGΩ; 5 - 100GΩ; 6 - 10GΩ; 7 - 1GΩ; 8 - 100MΩ; 9 - 10MΩ; 10 - 1MΩ; 11 - Manual
# VOLT: 1 - Auto; 2 - 2V; 3 - 20V
Range = 5

# Скорость измерения
# FAST|MID|SLOW
# FAST = 1*PLC（20ms); MID = 10*PLC（0.2ms); SLOW = 100*PLC（2 s)
Speed = FAST

# Страница дисплея, необходимо быть на ней для измерения
# MEAS
DisplayPage = MEAS

# Включение/выключение амперметра
# ON|OFF
AmmeterSwitch = ON

# Установка напряжения
# значение в вольтах
#SourceValue = 0

# Включение/выключение источника
# ON|OFF
#SourceSwitch = ON
 
[PICOAMMETER_TEST_1]

#Режим прибора
#RES|VOLT|CURR|SRC
Func = CURR
#Диапазон измерения
#задается как номер из таблицы в мануале (Chapter 5)
Range = 5
#Скорость измерения
#FAST|MID|SLOW
Speed = MID

[PICOAMMETER_TEST_2]

Func = RES
Range = 2
Speed = FAST

[PICOAMMETER_TEST_3]

Func = VOLT
Range = 4
Speed = SLOW

[PICOAMMETER_1kV]

Func = CURR
#Range = 4
Speed = MID

[PROBE_-20V]

Func = CURR
Range = 5
Speed = MID
DisplayPage = MEAS
AmmeterSwitch = ON
SourceValue = 0
SourceSwitch = ON